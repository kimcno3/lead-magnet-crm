          description: unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: 없는 신청 (not_found)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "410":
          description: "보존 기간이 지나 파기된 신청 (lead_anonymized, ADR 0020)"
          content:
            application/problem+json:

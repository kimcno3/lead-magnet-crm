      - HTML 템플릿
      summary: 템플릿 검사만 하기
      description: "업로드와 같은 파일 검사를 하고 추출될 필드와 경고(inspection)만 돌려준다. 아무것도 저장하지 않는다\
        . 경고는 업로드를 막지 않고, 계약 오류는 업로드와 같은 오류 코드로 답한다."
      operationId: inspectTemplate
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: 검사 리포트(저장 안 됨)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateInspectionResponse"
        "401":
          description: unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateInspectionResponse"
        "413":
          description: template_too_large 또는 payload_too_large
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateInspectionResponse"
        "422":
          description: 업로드와 같은 계약 오류(template_*)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateInspectionResponse"
      security:
      - bearer: []
  /api/admin/templates/{id}:
    get:
      tags:
      - HTML 템플릿
      summary: 템플릿 상세
      description: "원문 content, 추출한 fields, 검사 경고 inspection 포함. 검사 결과가 없는 기존 템플릿은\
        \ 읽을 때 계산한다."
      operationId: getTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: 상세
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateDetailResponse"
        "401":
          description: unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateDetailResponse"
        "404":
          description: not_found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateDetailResponse"
      security:
      - bearer: []
    put:
      tags:
      - HTML 템플릿
      summary: 템플릿 새 버전 업로드
      description: "업로드와 같은 파일 검사(multipart file, .html/.htm, UTF-8, 512KB 이하, 폼 계\
        약)를 통과하면 내용·sha256·필드·크기·검사 결과를 바꾸고 version을 올린다. 이 템플릿을 쓰는 draft 폼은 새 필드로\
        \ 다시 스냅샷한다(운영자가 바꾼 label·required는 같은 이름이면 유지). 게시·마감된 폼은 게시 시점 스냅샷을 쓰므로 영\
        향이 없다. 감사 로그(template.version.upload)에 버전과 영향받은 draft 수가 남고, 기록에 실패하면 업로드도\
        \ 롤백된다 (ADR 0016). 응답 affectedDraftForms는 다시 스냅샷한 draft 폼 수. 이름은 바뀌지 않는다."
      operationId: uploadTemplateVersion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: 새 버전 적용됨
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateVersionResponse"
        "401":
          description: unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateVersionResponse"
        "404":
          description: not_found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateVersionResponse"
        "413":
          description: template_too_large 또는 payload_too_large
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateVersionResponse"
        "422":
          description: 업로드와 같은 계약 오류(template_*). 템플릿은 바뀌지 않는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateVersionResponse"
      security:
      - bearer: []
  /api/public/forms/{slug}:
    get:
      tags:
      - 공개 폼
      summary: 공개 폼 조회
      description: "published 폼의 제목, 동의 문구, 필드 설정, 템플릿 HTML 원문과 작성 시간 토큰 ft(제출에 그대\
        로 실어 보낸다, ADR 0019)"
      operationId: getPublicForm
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: 공개 중
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicFormResponse"
        "404":
          description: 없는 slug 또는 draft (not_found)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicFormResponse"
        "410":
          description: closed (gone)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicFormResponse"
      servers:
      - url: http://localhost:8081
        description: "public 출처 (PUBLIC_BASE_URL). /f, /l, /api/public 경로는 이 출처에서만\
          \ 열린다"
  /api/public/forms/{slug}/submissions:
    post:
      tags:
      - 공개 폼
      summary: 신청 제출
      description: "Content-Type: application/json만 받는다. Origin: null(sandbox 프레임\
        )은 거절한다. name·phone·email 필드는 컬럼으로, 나머지는 payload로 저장한다. 같은 폼의 같은 전화번호·이메일은\
        \ 409. 검사 순서: 403 → 413 → 429 → 400·415 → 404·410 → 422 invalid_form_token\
        \ → honeypot → 422 validation_failed → 409 (ADR 0019)."
      operationId: submitForm
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionRequest"
        required: true
      responses:
        "201":
          description: "접수됨 {status: received}. honeypot(fields._lm_trap)이 채워진 제출도\
            \ 같은 201이지만 저장하지 않는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          description: malformed_request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "403":
          description: forbidden_origin
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "404":
          description: 없는 slug 또는 draft (not_found)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "409":
          description: duplicate_submission
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "410":
          description: closed (gone)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "415":
          description: unsupported_media_type
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "422":
          description: "invalid_form_token(ft가 없거나 위조·다른 slug·발급 2초 미만·24시간 초과) 또는\
            \ validation_failed. errors[].code: unknown_field, required, invalid_format,\
            \ invalid_option, invalid_value, too_long, consent_required, contact_required"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "429":
          description: "too_many_requests. IP 분당 10회·방문자 쿠키 분당 5회(기본값) 초과, Retry-After\
            \ 헤더(초)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
      servers:
      - url: http://localhost:8081
        description: "public 출처 (PUBLIC_BASE_URL). /f, /l, /api/public 경로는 이 출처에서만\
          \ 열린다"
  /f/{slug}:
    get:
      tags:
      - 공개 폼
      summary: 공개 폼 페이지
      description: "래퍼 셸 HTML. 방문 1건 기록, 방문자 쿠키 lm_vid 발급. lm이 이 폼의 링크 code면 그 채널로\
        , 아니면 direct로 귀속한다."
      operationId: showPublicFormPage
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: lm
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: 래퍼 셸
          content:
            '*/*':
              schema:
                type: string
        "404":
          description: 없는 slug 또는 draft (HTML 안내)
          content:
            '*/*':
              schema:
                type: string
        "410":
          description: closed (HTML 안내)
          content:
            '*/*':
              schema:
                type: string
      servers:
      - url: http://localhost:8081
        description: "public 출처 (PUBLIC_BASE_URL). /f, /l, /api/public 경로는 이 출처에서만\
          \ 열린다"
  /l/{code}:
    get:
      tags:
      - 공개 링크
      summary: 단축 URL 리다이렉트
      description: "302 Location: /f/{slug}?lm={code}"
      operationId: redirectShortLink
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "302":
          description: 공개 폼으로 이동
          content:
            '*/*':
              schema:
                type: string
        "404":
          description: 없는 code 또는 draft 폼 (HTML 안내)
          content:
            '*/*':
              schema:
                type: string
        "410":
          description: closed 폼 (HTML 안내)
          content:
            '*/*':
              schema:
                type: string
      servers:
      - url: http://localhost:8081
        description: "public 출처 (PUBLIC_BASE_URL). /f, /l, /api/public 경로는 이 출처에서만\
          \ 열린다"
components:
  schemas:
    FormField:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        required:
          type: boolean
        label:
          type: string
        options:
          type: array
          items:
            type: string
    InspectionWarning:
      type: object
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
          - warning
          - info
        message:
          type: string
        location:
          type: string
    TemplateVersionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        size:
          type: integer
          format: int32
        sha256:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FormField"
        inspection:
          type: array
          items:
            $ref: "#/components/schemas/InspectionWarning"
        version:
          type: integer
          format: int32
        updatedAt:
          type: string
          format: date-time
        affectedDraftForms:
          type: integer
          format: int32
    SubmissionRequest:
      type: object
      properties:
        fields:
          type: object
          additionalProperties: {}
          description: 필드 이름 → 문자열 또는 문자열 배열(checkbox). _lm_trap은 honeypot(래퍼가 항상
            빈 문자열로 보낸다)
        consent:
          type: string
          description: 개인정보 수집·이용 동의. true여야 한다
        lm:
          type: string
          description: "배포 링크 code(/f/{slug}?lm=...). 없으면 direct"
        ft:
          type: string
          description: "작성 시간 토큰. GET /api/public/forms/{slug} 응답의 ft 그대로"
    SubmissionResponse:
      type: object
      properties:
        status:
          type: string
    TemplateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        size:
          type: integer
          format: int32
        sha256:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FormField"
        inspection:
          type: array
          items:
            $ref: "#/components/schemas/InspectionWarning"
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TemplateInspectionResponse:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
          format: int32
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FormField"
        inspection:
          type: array
          items:
            $ref: "#/components/schemas/InspectionWarning"
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type:
          - string
          - "null"
        status:
          type: integer
          format: int32
        detail:
          type:
          - string
          - "null"
        instance:
          type:
          - string
          - "null"
          format: uri
        properties:
          type:
          - object
          - "null"
          additionalProperties: {}
    RetentionRunResponse:
      type: object
      properties:
        anonymized:
          type: integer
          format: int64
        dryRun:
          type: boolean
        interrupted:
          type: boolean
    PiiReencryptResponse:
      type: object
      properties:
        reencrypted:
          type: integer
          format: int64
          description: 이번 실행이 현재 키로 다시 암호화한 신청 수(dryRun이면 0)
        unreadable:
          type: integer
          format: int64
          description: 어느 키로도 풀지 못해 건너뛴 신청 수. 남은 건수에 남는다
        remaining:
          type: integer
          format: int64
          description: 이전 키로 남은 행 수(신청 + 키 확인 행). 0이면 LEAD_ENC_PREVIOUS_KEYS를 지워도
            된다
        currentKeyId:
          type: integer
          format: int32
          description: 현재 암호화 키 id(LEAD_ENC_KEY_ID)
        dryRun:
          type: boolean
        interrupted:
          type: boolean
          description: 다른 실행이 처리 중이어서 이번 실행이 멈췄는지
    CreateLinkRequest:
      type: object
      properties:
        channel:

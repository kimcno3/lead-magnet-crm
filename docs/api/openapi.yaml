  /api/admin/pii/reencrypt:
    post:
      tags:
      - 개인정보 키
      summary: 개인정보 재암호화 실행
      description: "LEAD_ENC_KEY를 새 키(LEAD_ENC_KEY_ID)로 바꾸고 이전 키를 LEAD_ENC_PREVIOUS_KEYS에\
        \ 둔 채 기동한 뒤 부른다. 현재 키가 아닌 키로 만든 신청 암호문(이름·전화번호·이메일)을 배치마다 현재 키로 다시 암호화하고,\
        \ 신청이 모두 끝나면 키 확인 행도 바꾼다. 파기된 신청은 건너뛴다. 응답의 remaining이 0이면 LEAD_ENC_PREVIOUS_KEYS를\
        \ 지우고 다시 기동해도 된다. 실행은 감사 로그(pii.reencrypt, 건수만)에 남는다. 다른 인스턴스가 처리 중이면 interrupted=true.\
        \ 배치가 실패하면 그때까지의 건수를 completed=false로 기록한 뒤 500이다(앞 배치는 그대로, 다시 실행하면 이어서 한\
        다). dryRun=true면 아무것도 바꾸지 않고 남은 건수만 준다(기록 없음)."
      operationId: reencryptPii
      parameters:
      - name: dryRun
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: 재암호화 결과와 남은 건수
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PiiReencryptResponse"
        "500":
          description: 배치 실패 (internal_error). 그때까지의 건수는 감사 로그에 completed=false로 남는다
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /api/admin/retention/run:
    post:
      tags:
      - 보존 기간
      summary: 보존 기간 파기 수동 실행
      description: "매일 03:00(Asia/Seoul) 스케줄러와 같은 작업을 지금 실행한다. 캠페인의 retentionDays\
        \ × 24시간이 지난 신청의 이름·연락처(암호문·해시)를 지우고 payload는 키만 남긴다. 행과 지표에 쓰는 값은 남는다. 실행\
        은 감사 로그(retention.anonymize, 건수)에 남는다. 다른 인스턴스가 배치를 처리 중이면 그 실행에 맡기고 이번 실행\
        이 처리한 건수와 interrupted=true를 준다. 배치가 실패하면 그때까지의 건수를 completed=false로 기록한 뒤\
        \ 500이다(앞 배치의 파기는 되돌리지 않는다). dryRun=true면 아무것도 바꾸지 않고 대상 건수만 준다(기록 없음)."
      operationId: runRetention
      parameters:
      - name: dryRun
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: 익명화한(dryRun이면 대상) 신청 수
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RetentionRunResponse"
        "500":
          description: 배치 실패 (internal_error). 그때까지의 건수는 감사 로그에 completed=false로 남는다
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []

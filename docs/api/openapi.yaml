        \ 0020). 신청자 개인정보가 아니어서 원문 연락처 API와 따로 두고 감사 로그에 남기지 않는다. 파기된 신청도 증빙은 남아 있\
        다. V10 이전 신청은 그때 폼의 문구로 백필한 값이고, 백필하지 못했으면 null이다."

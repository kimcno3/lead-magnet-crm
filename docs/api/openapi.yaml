openapi: 3.1.0
info:
  title: 리드마그넷 CRM API
  description: |-
    관리자 API(`/api/admin/**`)는 admin 출처(기본 :8080)에서 Bearer access token으로 호출한다.
    공개 경로(`/f/{slug}`, `/l/{code}`, `/api/public/**`)는 같은 앱이지만 public 출처
    (`PUBLIC_BASE_URL`, 기본 :8081)에서만 열리고 인증이 없다. 서로의 포트에서는 404다 (ADR 0010).
    에러는 모두 ProblemDetail(`application/problem+json`, 확장 속성 `code`)이다.
  version: 0.3.0
servers:
- url: http://localhost:8080
  description: "admin 출처 (관리자 API, 이 문서)"
tags:
- name: 개인정보 키
  description: 개인정보 암호화 키 교체 (ADR 0022)
- name: 명단
  description: 캠페인별 신청 명단 (ADR 0008)
- name: 크리에이터
  description: 수익 배분 협업 크리에이터 등록·조회·수정·보관 (ADR 0014)
- name: 공개 링크
  description: 단축 URL 리다이렉트
- name: 감사 로그
  description: 명단 조회·원문 열람·CSV 다운로드·로그인 기록 (ADR 0016). 조회만 있고 수정·삭제는 없다.
- name: 폼
  description: 캠페인의 공개 신청 폼 생성·수정·게시·마감 (ADR 0013)
- name: 캠페인
  description: 캠페인 생성·조회·수정·보관 (ADR 0013)
- name: 공개 폼
  description: public 출처(:8081) 전용. 래퍼 스크립트가 호출한다 (ADR 0002)
- name: 배포 링크
  description: "폼의 채널·크리에이터별 배포 링크 (ADR 0006, 0014)"
- name: HTML 템플릿
  description: AI가 만든 단일 HTML 폼 업로드와 조회 (ADR 0004)
- name: 보존 기간
  description: 보존 기간이 지난 신청 익명화 (ADR 0020)
- name: 인증
  description: 운영자 로그인과 토큰 교체 (ADR 0003)
- name: 성과 조회
  description: "캠페인·채널·크리에이터별 방문, 방문자, 신청, 전환 방문자, 전환율 (ADR 0005, 0014)"
paths:
  /api/admin/audit-logs:
    get:
      tags:
      - 감사 로그
      summary: 감사 로그
      description: "최신순. action은 AuditAction의 값 중 하나(허용 값은 파라미터 스키마의 enum). from·\
        to는 Asia/Seoul 날짜(yyyy-MM-dd, 양 끝 포함). page는 0부터, size는 1~100(기본 20). 이 조회\
        \ 자체는 기록하지 않는다."
      operationId: listAuditLogs
      parameters:
      - name: action
        in: query
        required: false
        schema:
          type: string
          enum:
          - lead.list
          - lead.contact.view
          - lead.export
          - lead.export.reveal
          - auth.login.success
          - auth.login.failure
          - auth.login.locked
          - retention.anonymize
          - campaign.retention.update
          - auth.refresh.reused
          - auth.logout
          - form.publish
          - form.close
          - template.version.upload
          - creator.archive
          - pii.reencrypt
      - name: operatorId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: campaignId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: 감사 로그 한 페이지
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuditLogPageResponse"
        "401":
          description: unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: 잘못된 action·page·size·기간 (validation_failed)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /api/admin/auth/login:
    post:
      tags:
      - 인증
      summary: 로그인
      description: "access token은 바디로, refresh token은 HttpOnly 쿠키(lm_refresh)로 준다\
        . 성공·실패는 감사 로그에 남는다(ADR 0016). (이메일, IP) 쌍·이메일 전체·IP별 실패가 창(기본 15분) 안에서 한도\
        (기본 5회·50회·20회)에 닿으면 비밀번호를 확인하지 않고 429를 준다. 없는 이메일도 같은 규칙이다(ADR 0021)."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: 로그인 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: "invalid_credentials: 이메일 또는 비밀번호가 틀림"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: "validation_failed: 요청 형식 오류"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: "too_many_login_attempts: 로그인 시도 제한. Retry-After 헤더(초) 뒤에 다\
            시 시도한다"
          headers:
            Retry-After:
              description: 다시 시도할 수 있을 때까지의 초
              style: simple
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/admin/auth/logout:
    post:
      tags:
      - 인증
      summary: 로그아웃
      description: refresh 토큰 패밀리를 폐기하고 쿠키를 지운다. 쿠키가 없어도 204다.
      operationId: logout
      parameters:
      - name: lm_refresh
        in: cookie
        description: refresh token
      responses:
        "204":
          description: 로그아웃
  /api/admin/auth/me:
    get:
      tags:
      - 인증
      summary: 현재 운영자
      operationId: getCurrentOperator
      responses:
        "200":
          description: 현재 운영자
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: "unauthorized: 토큰이 없거나 유효하지 않음"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
      security:
      - bearer: []
  /api/admin/auth/refresh:
    post:
      tags:
      - 인증
      summary: access token 재발급
      description: refresh 쿠키를 교체한다. 이미 쓴 토큰이 오면 그 로그인의 토큰을 모두 폐기한다.
      operationId: refreshToken
      parameters:
      - name: lm_refresh
        in: cookie
        description: refresh token
      responses:
        "200":
          description: 재발급 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: invalid_refresh_token 또는 refresh_token_reused
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /api/admin/campaigns:
    get:
      tags:
      - 캠페인
      summary: 캠페인 목록
      description: 최신순. formCount는 상태와 무관하게 센다.
      operationId: listCampaigns
      responses:
        "200":
          description: 목록
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignSummaryResponse"
        "401":
          description: unauthorized
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignSummaryResponse"
      security:
      - bearer: []
    post:
      tags:
      - 캠페인
      summary: 캠페인 생성
      description: "retentionDays는 신청 보존 기간(일, 1~3650, 기본 365). 지나면 매일 03:00(KST)\
        \ 익명화한다 (ADR 0020)."
      operationId: createCampaign
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignRequest"
        required: true
      responses:
        "201":
          description: 생성됨. Location에 상세 경로
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CampaignResponse"
        "401":
          description: unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CampaignResponse"
        "422":
          description: validation_failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CampaignResponse"
      security:
      - bearer: []
  /api/admin/campaigns/{campaignId}/forms:
    post:
      tags:
      - 폼
      summary: 폼 생성
      description: 템플릿 fields를 스냅샷으로 복사한 draft 폼을 만든다. slug를 생략하면 8자 랜덤.
      operationId: createForm
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFormRequest"
        required: true
      responses:
        "201":
          description: 생성됨. Location에 상세 경로
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FormResponse"
        "401":
          description: unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FormResponse"
        "404":
          description: 캠페인 또는 템플릿 없음 (not_found)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FormResponse"
        "409":
          description: "campaign_archived, slug_taken"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FormResponse"
        "422":
          description: validation_failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FormResponse"
      security:
      - bearer: []
  /api/admin/campaigns/{campaignId}/leads:
    get:
      tags:
      - 명단
      summary: 캠페인 명단
      description: "최신순. page는 0부터, size는 1~100(기본 20). channel은 instagram, x, youtube,\
        \ threads, direct. 조회는 감사 로그(lead.list)에 남는다(ADR 0016)."
      operationId: listLeads
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: formId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: channel
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: 명단 한 페이지
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadPageResponse"
        "401":
          description: unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadPageResponse"
        "404":
          description: 없는 캠페인 (not_found)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadPageResponse"
        "422":
          description: 잘못된 page·size·channel (validation_failed)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LeadPageResponse"
      security:
      - bearer: []
  /api/admin/campaigns/{campaignId}/leads.csv:
    get:
      tags:
      - 명단
      summary: 명단 CSV 다운로드
      description: "UTF-8 BOM으로 시작하는 RFC 4180 CSV. 열은 신청일(Asia/Seoul), 이름, 전화번호, 이\
        메일, 채널, 크리에이터, 폼, 추가 항목(payload JSON), 파기이고 신청 순이다. 보존 기간이 지나 파기된 신청은 연락처·\
        추가 항목 칸이 비고 파기 칸이 \"파기됨\"이다(ADR 0020). 기본은 가린 값, reveal=true면 원문(전화번호는 숫자만\
        )이다. =, +, -, @, 탭, CR로 시작하는 값에는 작은따옴표를 붙인다. 복호화하지 못한 행은 연락처 칸에 \"복호화 불가\"\
        . 다운로드는 감사 로그(lead.export, 원문은 lead.export.reveal)에 건수와 함께 남고, 기록에 실패하면 내용\
        을 주지 않고 500이다(ADR 0016)."
      operationId: exportLeadsCsv
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: formId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: channel
        in: query
        required: false
        schema:
          type: string
      - name: reveal
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: CSV 파일
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          description: unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: 없는 캠페인 (not_found)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: 잘못된 channel (validation_failed)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /api/admin/campaigns/{campaignId}/stats:
    get:
      tags:
      - 성과 조회
      summary: 캠페인 지표
      description: "from, to는 yyyy-MM-dd(Asia/Seoul)이고 둘 다 선택이다. from 00:00 이상, to\
        \ 다음날 00:00 미만. conversionRate는 소수 넷째 자리 반올림."
      operationId: getCampaignStats
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: 캠페인 전체 지표
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CampaignStatsResponse"
        "401":
          description: unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CampaignStatsResponse"
        "404":
          description: 없는 캠페인 (not_found)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CampaignStatsResponse"
        "422":
          description: 날짜 형식·범위 오류 (validation_failed)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CampaignStatsResponse"
      security:
      - bearer: []
  /api/admin/campaigns/{campaignId}/stats/channels:
    get:
      tags:
      - 성과 조회
      summary: 캠페인 채널별 지표
      description: "from, to는 yyyy-MM-dd(Asia/Seoul)이고 둘 다 선택이다. from 00:00 이상, to\
        \ 다음날 00:00 미만. conversionRate는 소수 넷째 자리 반올림. 다섯 채널을 항상 0 포함해 돌려준다."
      operationId: getCampaignChannelStats
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "instagram, x, youtube, threads, direct 순서"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChannelStatsResponse"
        "401":
          description: unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChannelStatsResponse"
        "404":
          description: 없는 캠페인 (not_found)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChannelStatsResponse"
        "422":
          description: 날짜 형식·범위 오류 (validation_failed)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChannelStatsResponse"
      security:
      - bearer: []
  /api/admin/campaigns/{campaignId}/stats/creators:
    get:
      tags:
      - 성과 조회
      summary: 캠페인 크리에이터별 지표
      description: "from, to는 yyyy-MM-dd(Asia/Seoul)이고 둘 다 선택이다. from 00:00 이상, to\
        \ 다음날 00:00 미만. conversionRate는 소수 넷째 자리 반올림. 이 캠페인에 링크가 있는 크리에이터를 등록순으로(데\
        이터가 없어도 0), 마지막에 creator가 null인 \"직접·자체 링크\"(크리에이터 없는 링크 + direct) 행. 전환은\
        \ 같은 크리에이터 안의 교집합이고, channels는 같은 크리에이터·같은 채널 안의 교집합이다(크리에이터 행은 링크 채널 네 개\
        , 직접·자체 링크 행은 direct까지 다섯 개)."
      operationId: getCampaignCreatorStats
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: 크리에이터별 지표
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreatorStatsResponse"
        "401":
          description: unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreatorStatsResponse"
        "404":
          description: 없는 캠페인 (not_found)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreatorStatsResponse"
        "422":
          description: 날짜 형식·범위 오류 (validation_failed)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreatorStatsResponse"
      security:
      - bearer: []
  /api/admin/campaigns/{id}:
    get:
      tags:
      - 캠페인
      summary: 캠페인 상세
      description: 소속 폼 요약 포함
      operationId: getCampaign
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: 상세
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CampaignResponse"
        "401":
          description: unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CampaignResponse"
        "404":
          description: not_found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CampaignResponse"
      security:
      - bearer: []
    patch:
      tags:
      - 캠페인
      summary: 캠페인 수정·보관
      description: "없는 필드는 그대로 둔다. status는 \"archived\"만 받는다. retentionDays는 1~3650이\
        고, 바뀌면 감사 로그(campaign.retention.update, 이전·새 값)에 남는다 (ADR 0020)."
      operationId: updateCampaign
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64

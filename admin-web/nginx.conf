# admin-web 출처. 관리자 API는 같은 출처로 backend admin 포트(:8080)에 프록시한다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # 보안 헤더(ADR 0011). 하위 블록에 헤더 지시어를 따로 두면 여기 값이 상속되지 않으므로 두지 않는다.
    # CSP 값은 csp.ts의 ADMIN_CSP와 같아야 한다(csp.test.ts가 확인).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/admin/ {
        # nginx 기본 한도(1m)를 넘는 업로드도 Spring까지 보내 ProblemDetail 413(template_too_large·payload_too_large)을 받게 한다.
        client_max_body_size 2m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # admin-web이 맨 앞단 프록시라 브라우저가 보낸 X-Forwarded-For를 이어 붙이지 않고 직전 피어 주소로 덮어쓴다(위조 값이 남지 않게).
        # backend는 이 컨테이너가 TRUSTED_PROXIES 대역일 때만 이 값을 클라이언트 IP로 쓴다(ADR 0021). 앞에 프록시를 더 두면
        # $proxy_add_x_forwarded_for로 되돌리고 그 프록시 주소도 TRUSTED_PROXIES에 넣는다. X-Real-IP는 backend가 읽지 않는다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}

name: lead-magnet-crm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 설정하세요}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    ports:
      # 호스트 루프백에만 연다(같은 LAN에서 DB에 바로 닿지 않게, ADR 0021)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      ADMIN_PORT: 8080
      PUBLIC_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 설정하세요}
      LEAD_ENC_KEY: ${LEAD_ENC_KEY:?LEAD_ENC_KEY를 .env에 설정하세요}
      LEAD_HMAC_KEY: ${LEAD_HMAC_KEY:?LEAD_HMAC_KEY를 .env에 설정하세요}
      LEAD_ENC_KEY_ID: ${LEAD_ENC_KEY_ID:-1}
      LEAD_ENC_PREVIOUS_KEYS: ${LEAD_ENC_PREVIOUS_KEYS:-}
      LEAD_HMAC_PREVIOUS_KEY: ${LEAD_HMAC_PREVIOUS_KEY:-}
      FORM_TOKEN_KEY: ${FORM_TOKEN_KEY:?FORM_TOKEN_KEY를 .env에 설정하세요}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8081}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      # admin 포트에서 X-Forwarded-For를 믿을 직전 피어. 기본은 admin-web nginx의 고정 주소 하나다(ADR 0021).
      # 네트워크 대역 전체를 쓰면 게이트웨이(172.16.57.1)가 들어가는데, 공개된 포트로 들어온 연결은 Docker Desktop·
      # userland-proxy에서 게이트웨이 주소로 보이므로 그 연결의 위조 XFF까지 믿게 된다.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.57.10/32}
    ports:
      # admin 포트는 호스트 루프백에만 연다(헬스체크·Swagger·E2E용). 관리자 화면은 내부 네트워크로 backend에 닿는다(ADR 0021)
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"
      - "${PUBLIC_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  admin-web:
    build:
      context: ./admin-web
      args:
        VITE_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8081}
    ports:
      - "${ADMIN_WEB_PORT:-5173}:8080"
    networks:
      default:
        # TRUSTED_PROXIES 기본값과 같은 고정 주소(ADR 0021)
        ipv4_address: 172.16.57.10
    depends_on:
      backend:
        condition: service_healthy

# 대역을 고정하고 admin-web에 고정 주소(172.16.57.10)를 줘 TRUSTED_PROXIES 기본값이 admin-web 컨테이너 하나만 가리키게 한다
# (ADR 0021). 이 대역이 다른 네트워크·VPN과 겹치면 대역, admin-web 주소, TRUSTED_PROXIES를 함께 바꾼다.
# 예전에 만든 네트워크가 남아 있으면(대역이 다르거나 고정 전) docker compose down으로 지우고 다시 올린다.
networks:
  default:
    ipam:
      config:
        - subnet: 172.16.57.0/24
          # 자동 할당은 뒤쪽 절반에서만 해 admin-web 고정 주소(.10)와 겹치지 않게 한다
          ip_range: 172.16.57.128/25

volumes:
  postgres-data:

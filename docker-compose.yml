name: lead-magnet-crm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 설정하세요}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      ADMIN_PORT: 8080
      PUBLIC_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 설정하세요}
      LEAD_ENC_KEY: ${LEAD_ENC_KEY:?LEAD_ENC_KEY를 .env에 설정하세요}
      LEAD_HMAC_KEY: ${LEAD_HMAC_KEY:?LEAD_HMAC_KEY를 .env에 설정하세요}
      FORM_TOKEN_KEY: ${FORM_TOKEN_KEY:?FORM_TOKEN_KEY를 .env에 설정하세요}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8081}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      # admin 포트에서 X-Forwarded-For를 믿을 직전 피어. 기본은 아래 default 네트워크 대역(admin-web nginx가 여기 있다, ADR 0021)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.57.0/24}
    ports:
      - "${ADMIN_PORT:-8080}:8080"
      - "${PUBLIC_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  admin-web:
    build:
      context: ./admin-web
      args:
        VITE_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8081}
    ports:
      - "${ADMIN_WEB_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy

# 대역을 고정해 TRUSTED_PROXIES 기본값이 admin-web 컨테이너만 가리키게 한다(ADR 0021). 이 대역이 다른 네트워크와 겹치면
# 두 값을 함께 바꾼다. 대역을 바꾼 뒤에는 docker compose down으로 기존 네트워크를 지우고 다시 올린다.
networks:
  default:
    ipam:
      config:
        - subnet: 172.16.57.0/24

volumes:
  postgres-data:

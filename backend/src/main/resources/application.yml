spring:
  application:
    name: lead-magnet-crm
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${app.ports.admin}

app:
  ports:
    admin: ${ADMIN_PORT:8080}
    public-port: ${PUBLIC_PORT:8081}
  auth:
    # 필수. 없으면 기동이 실패한다. UTF-8 32바이트 이상 (ADR 0003)
    jwt-secret: ${JWT_SECRET}
    admin-origin: ${ADMIN_ORIGIN:http://localhost:5173}
    cookie-secure: ${COOKIE_SECURE:false}
  template:
    # 업로드 HTML 최대 바이트(512KB). multipart 한도(1MB)와의 사이 크기는 애플리케이션이 413으로 막는다 (ADR 0004)
    max-bytes: 524288
  seed:
    operator:
      email: ${ADMIN_SEED_EMAIL:}
      password: ${ADMIN_SEED_PASSWORD:}

# OpenAPI 문서. admin 포트 전용 제한은 이슈 #7(OriginGuardFilter)에서 붙인다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

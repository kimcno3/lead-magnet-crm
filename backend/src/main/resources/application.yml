spring:
  application:
    name: lead-magnet-crm

server:
  port: ${app.ports.admin}

app:
  ports:
    admin: ${ADMIN_PORT:8080}
    public-port: ${PUBLIC_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

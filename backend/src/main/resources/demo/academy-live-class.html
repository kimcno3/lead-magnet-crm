<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유튜브 첫 1,000명 구독자 로드맵 · 무료 라이브 클래스</title>
<style>
  :root { --ink: #14151a; --sub: #5d6170; --line: #e4e6ee; --soft: #f6f7fb; --accent: #6a4cff;
    --prism: linear-gradient(120deg, #ff6fb5 0%, #ffb86b 22%, #ffe66d 40%, #6ff0c4 60%, #6ab8ff 80%, #a67bff 100%); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 28px; color: var(--ink); background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; }
  .hero { position: relative; padding: 26px 22px 22px; border-radius: 18px; background: #101118; color: #fff; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--prism); }
  .hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%;
    background: var(--prism); opacity: .28; filter: blur(30px); }
  .brand { font-size: 12px; font-weight: 700; letter-spacing: .12em; opacity: .75; }
  .tag { display: inline-block; margin-top: 14px; padding: 4px 10px; font-size: 12px; font-weight: 700; border-radius: 999px;
    background: rgba(255,255,255,.12); }
  h1 { position: relative; margin: 10px 0 8px; font-size: 24px; line-height: 1.35; letter-spacing: -.02em; }
  .lead { position: relative; margin: 0; font-size: 15px; line-height: 1.6; opacity: .85; }
  form { display: grid; gap: 16px; padding: 22px 2px 6px; }
  .row { display: grid; gap: 6px; }
  .row > label, .group-title { font-size: 14px; font-weight: 700; }
  .opt { color: var(--sub); font-weight: 500; font-size: 12px; margin-left: 4px; }
  input[type=text], input[type=tel], input[type=email], input[type=url], select, textarea {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--ink); background: var(--soft);
    border: 1px solid var(--line); border-radius: 12px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; font-size: 14px;
    border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
  .hint { color: var(--sub); font-size: 12px; }
  button { padding: 15px; font: inherit; font-weight: 800; color: #fff; border: 0; border-radius: 14px; cursor: pointer;
    background: #14151a; box-shadow: 0 0 0 2px #fff inset, 0 6px 18px rgba(106, 76, 255, .25); }
  button:hover { background: #262833; }
  .foot { margin-top: 6px; text-align: center; font-size: 12px; color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="brand">GLOW UP RIZZ ACADEMY</div>
    <span class="tag">무료 라이브 · 매주 목요일 저녁 8시</span>
    <h1>유튜브 첫 1,000명 구독자 로드맵</h1>
    <p class="lead">기획부터 썸네일, 첫 수익화까지. 현업 프로듀서가 90분 안에 다 보여드립니다.</p>
  </section>

  <form>
    <div class="row">
      <label for="f-name">이름</label>
      <input id="f-name" type="text" name="name" autocomplete="name" placeholder="홍길동" required>
    </div>
    <div class="row">
      <label for="f-phone">휴대폰 번호</label>
      <input id="f-phone" type="tel" name="phone" autocomplete="tel" inputmode="numeric" placeholder="010-0000-0000" required>
      <span class="hint">클래스 입장 안내를 이 번호로 드려요.</span>
    </div>
    <div class="row">
      <label for="f-email">이메일</label>
      <input id="f-email" type="email" name="email" autocomplete="email" placeholder="you@example.com (선택)">
    </div>
    <div class="row">
      <label for="f-channel">내 채널 주소</label>
      <input id="f-channel" type="url" name="channel_url" placeholder="https://www.youtube.com/@mychannel">
    </div>
    <div class="row">
      <label for="f-stage">지금 채널 단계</label>
      <select id="f-stage" name="channel_stage" required>
        <option value="">선택해 주세요</option>
        <option value="아직 시작 전">아직 시작 전</option>
        <option value="구독자 1천 미만">구독자 1천 미만</option>
        <option value="1천~1만">1천~1만</option>
        <option value="1만 이상">1만 이상</option>
      </select>
    </div>
    <div class="row">
      <span class="group-title">가장 듣고 싶은 내용<span class="opt">여러 개 선택</span></span>
      <div class="chips">
        <label class="chip"><input type="checkbox" name="interests" value="기획">기획</label>
        <label class="chip"><input type="checkbox" name="interests" value="촬영·편집">촬영·편집</label>
        <label class="chip"><input type="checkbox" name="interests" value="썸네일·제목">썸네일·제목</label>
        <label class="chip"><input type="checkbox" name="interests" value="수익화">수익화</label>
      </div>
    </div>
    <div class="row">
      <label for="f-message">미리 묻고 싶은 것</label>
      <textarea id="f-message" name="message" rows="3" maxlength="300" placeholder="라이브에서 꼭 다뤘으면 하는 고민을 적어 주세요."></textarea>
    </div>
    <button type="submit">무료 클래스 신청하기</button>
  </form>
  <p class="foot">매력을 지속 가능한 가치로 · GLOW UP RIZZ</p>
</div>
</body>
</html>

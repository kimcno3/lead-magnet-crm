name: E2E

# 전체 시스템(docker compose)을 띄우고 브라우저 E2E(Playwright, Chromium)를 돌린다.
# 결과 파일은 저장소의 docs/e2e를 덮지 않도록 E2E_OUTPUT_DIR(e2e/ci-output)에 쓰고 아티팩트로만 올린다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_OUTPUT_DIR: ${{ github.workspace }}/e2e/ci-output
    steps:
      - uses: actions/checkout@v4

      - name: create .env with fresh keys
        run: |
          sed -e "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48)|" \
              -e "s|^LEAD_ENC_KEY=.*|LEAD_ENC_KEY=$(openssl rand -base64 32)|" \
              -e "s|^LEAD_HMAC_KEY=.*|LEAD_HMAC_KEY=$(openssl rand -base64 32)|" \
              -e "s|^FORM_TOKEN_KEY=.*|FORM_TOKEN_KEY=$(openssl rand -base64 32)|" \
              -e "s|^ADMIN_SEED_PASSWORD=.*|ADMIN_SEED_PASSWORD=$(openssl rand -hex 16)|" \
              .env.example > .env

      - name: start system
        run: docker compose up --build -d --wait --wait-timeout 300

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: install e2e dependencies
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: run e2e
        working-directory: e2e
        run: npm test

      - name: save compose logs
        if: always()
        run: docker compose logs --no-color > compose.log 2>&1 || true

      - name: upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/ci-output
          if-no-files-found: ignore

      - name: upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-report
          path: |
            e2e/playwright-report
            e2e/test-results
            compose.log
          if-no-files-found: ignore

      - name: stop system
        if: always()
        run: docker compose down -v
